# Remote Support — PRODUCTION deployment (public, HTTPS/WSS, TURN relay).
#
# One public domain fronts the whole app via Caddy (automatic Let's Encrypt TLS).
# coturn runs on the host network so WebRTC can traverse NAT between a remote
# agent and the technician's browser across the internet.
#
# Prereqs on the host:
#   * A domain whose DNS A record points at this machine's public IP.
#   * Open ports: 80/tcp, 443/tcp (Caddy), 3478/udp+tcp and 49160-49200/udp
#     (coturn).
#   * A .env file next to this compose (copy from ../.env.prod.example) with a
#     real DOMAIN, PUBLIC_IP, and strong secrets. APP_ENV must NOT be "dev".
#
# Usage:
#   cp ../.env.prod.example ./.env    # then edit
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See docs/DEPLOY.md for the full step-by-step.

name: remote-support-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      console:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./connect:/srv/connect:ro
      - ./agent-dist:/srv/agent:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-remote_support}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remote} -d ${POSTGRES_DB:-remote_support}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Strict mode: placeholder secrets are REJECTED. Do not set APP_ENV=dev.
      APP_ENV: ${APP_ENV:-prod}
      BACKEND_HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://remote:${POSTGRES_PASSWORD}@postgres:5432/remote_support?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 bytes)}
      JWT_TTL: ${JWT_TTL:-3600s}
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:?set AGENT_ENROLLMENT_TOKEN}
      SESSION_CODE_TTL: ${SESSION_CODE_TTL:-300s}
      SESSION_CODE_LENGTH: ${SESSION_CODE_LENGTH:-9}
      # Same-origin in production (console + API share the domain via Caddy).
      CORS_ALLOWED_ORIGIN: https://${DOMAIN}
      SEED_TECH_EMAIL: ${SEED_TECH_EMAIL:-}
      SEED_TECH_PASSWORD: ${SEED_TECH_PASSWORD:-}
      # ICE handed to both peers: your public STUN + TURN (coturn below).
      ICE_SERVERS: ${ICE_SERVERS:-["stun:${DOMAIN}:3478","turn:${DOMAIN}:3478"]}
      TURN_REALM: ${TURN_REALM:-${DOMAIN}}
      TURN_USER: ${TURN_USER:?set TURN_USER}
      TURN_PASSWORD: ${TURN_PASSWORD:?set TURN_PASSWORD}
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [internal]

  console:
    build:
      context: ../web-console
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, so the domain must be set
        # before building. Same origin as the API (Caddy path-routes /api + /ws).
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_BASE_URL: wss://${DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host network so the relay advertises the real public IP for ICE candidates.
    network_mode: host
    command: >
      -c /etc/coturn/turnserver.conf
      --realm=${TURN_REALM:-${DOMAIN}}
      --user=${TURN_USER}:${TURN_PASSWORD:?set TURN_PASSWORD}
      --external-ip=${PUBLIC_IP:?set PUBLIC_IP to this host's public IP}
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
