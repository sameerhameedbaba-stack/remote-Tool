# coturn configuration — Remote Support MVP (STUN + TURN relay).
#
# This file is intentionally kept OUTSIDE any application image and mounted
# into the coturn container by docker-compose. Secrets (realm, user, password)
# are injected at runtime from environment variables via the compose command,
# NOT hardcoded here. The values below are non-secret operational defaults.
#
# For production, replace static long-term credentials with time-limited TURN
# REST credentials (use-auth-secret / static-auth-secret). See docs/ROADMAP.md.

# Listening ports
listening-port=3478
# tls-listening-port=5349      # enable once you terminate TLS / provide certs

# Relay behavior
fingerprint
lt-cred-mech

# Realm and credentials are provided at container start via env substitution
# (see infra/docker-compose.yml command:). Do not commit real credentials here.
# realm=<TURN_REALM>
# user=<TURN_USER>:<TURN_PASSWORD>

# Relay range (keep modest for local/dev; widen for production NAT traversal)
min-port=49160
max-port=49200

# Operational hardening
no-cli
no-tlsv1
no-tlsv1_1
# Deny relaying to internal/link-local ranges to avoid SSRF-style abuse.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Re-allow the compose network so peers behind the relay can reach the app if
# needed; tighten per deployment.
allowed-peer-ip=172.16.0.0-172.31.255.255

# Logging
log-file=stdout
verbose
