# coturn configuration — PRODUCTION (STUN + TURN relay for NAT traversal).
#
# Runs on the host network so the relay advertises the machine's real public IP
# (set --external-ip in the compose command). Secrets (realm/user/password) and
# the external IP are injected at container start from environment variables —
# never committed here.
#
# For hardening beyond the MVP, switch static credentials to time-limited TURN
# REST credentials (use-auth-secret / static-auth-secret); see docs/ROADMAP.md.

listening-port=3478
# tls-listening-port=5349     # enable once you provide TLS certs for turns:

fingerprint
lt-cred-mech

# Relay port range — open these UDP ports on the host firewall / cloud SG.
min-port=49160
max-port=49200

# Operational hardening.
no-cli
no-tlsv1
no-tlsv1_1
# Refuse to relay to loopback / link-local / RFC1918 private ranges. This is the
# key anti-SSRF control: a TURN relay must never be usable to reach internal
# services on the host's private network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-fe80::ffff:ffff:ffff:ffff

# Modest quotas to blunt relay abuse.
user-quota=12
total-quota=1200

log-file=stdout
